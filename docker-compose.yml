services:
  postgres:
    image: postgres:16-alpine
    container_name: kameraz-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kameraz
      POSTGRES_PASSWORD: kameraz_secret
      POSTGRES_DB: kameraz
    volumes:
      - kameraz_pg_data:/var/lib/postgresql/data

volumes:
  kameraz_pg_data:
